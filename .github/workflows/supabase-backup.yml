name: Backup de Supabase

# Genera un backup diario de la base, lo cifra y lo guarda como "artifact"
# de GitHub Actions durante 30 días.

on:
  schedule:
    - cron: "0 6 * * *" # 03:00 hora de Argentina
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Instalar cliente de PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Generar y cifrar el backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          PGDUMP=/usr/lib/postgresql/17/bin/pg_dump
          fecha=$(date -u +%Y-%m-%d)
          mkdir backup

          # Tablas, funciones, políticas y datos de la app
          "$PGDUMP" "$SUPABASE_DB_URL" --no-owner --no-privileges \
            --schema=public > backup/public.sql

          # Cuentas de acceso (admin y empleados)
          "$PGDUMP" "$SUPABASE_DB_URL" --no-owner --no-privileges --data-only \
            -t auth.users -t auth.identities > backup/auth_usuarios.sql

          # Control: si el backup salió vacío o incompleto, el job falla
          grep -q "CREATE TABLE public.clients" backup/public.sql \
            || { echo "El backup parece incompleto"; exit 1; }

          tar -czf "backup-$fecha.tar.gz" -C backup .
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 "backup-$fecha.tar.gz"

          rm -rf backup "backup-$fecha.tar.gz"
          ls -lh

      - name: Guardar el backup
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup
          path: backup-*.tar.gz.gpg
          retention-days: 30
          if-no-files-found: error