name: Supabase keep-alive

# Hace una consulta a la base todos los días para que Supabase (plan gratuito)
# no pause el proyecto por inactividad. Si la consulta falla (por ejemplo,
# porque el proyecto ya está pausado), GitHub te avisa por mail.

on:
  schedule:
    - cron: "0 12 * * *" # 09:00 hora de Argentina
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar la base de datos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o response.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/business_settings?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "Respuesta HTTP: $status"
          if [ "$status" != "200" ]; then
            cat response.json
            exit 1
          fi